name: Offline behavioral tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: offline-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Run deterministic offline tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: code
        run: python -m unittest discover -s code/tests -p 'test_*.py' -v
